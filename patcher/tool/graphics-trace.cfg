# Warpforge Revival: what the phone does while the game starts (read by "6 - graphics trace.bat").
# A Perfetto system trace: CPU and GPU clock speeds, which thread ran on which core, the screen
# compositor's frame timeline (late or dropped frames), temperatures and throttling, memory.
buffers: { size_kb: 196608 fill_policy: RING_BUFFER }
buffers: { size_kb: 16384 fill_policy: RING_BUFFER }
duration_ms: 300000
flush_period_ms: 5000
data_sources: {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "sched/sched_process_free"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
      ftrace_events: "power/gpu_frequency"
      ftrace_events: "power/suspend_resume"
      ftrace_events: "gpu_mem/gpu_mem_total"
      ftrace_events: "thermal/thermal_temperature"
      ftrace_events: "thermal/cdev_update"
      ftrace_events: "mm_event/mm_event_record"
      ftrace_events: "kmem/rss_stat"
      ftrace_events: "lowmemorykiller/lowmemory_kill"
      ftrace_events: "oom/oom_score_adj_update"
      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "input"
      atrace_categories: "am"
      atrace_categories: "wm"
      atrace_categories: "hal"
      atrace_categories: "res"
      atrace_categories: "dalvik"
      atrace_categories: "aidl"
      atrace_categories: "freq"
      atrace_categories: "sched"
      atrace_categories: "memory"
      atrace_categories: "power"
      atrace_categories: "thermal"
      atrace_categories: "binder_driver"
      atrace_apps: "com.Everguild.WarhammerWarpforge"
      buffer_size_kb: 16384
      drain_period_ms: 250
      symbolize_ksyms: false
    }
  }
}
data_sources: { config { name: "android.surfaceflinger.frametimeline" } }
data_sources: { config { name: "android.gpu.memory" target_buffer: 1 } }
data_sources: {
  config {
    name: "linux.process_stats"
    target_buffer: 1
    process_stats_config { scan_all_processes_on_start: true proc_stats_poll_ms: 1000 }
  }
}
data_sources: {
  config {
    name: "linux.sys_stats"
    target_buffer: 1
    sys_stats_config { meminfo_period_ms: 1000 vmstat_period_ms: 1000 cpufreq_period_ms: 250 }
  }
}
data_sources: {
  config {
    name: "android.power"
    target_buffer: 1
    android_power_config { battery_poll_ms: 1000 collect_power_rails: true }
  }
}
data_sources: {
  config {
    name: "android.log"
    target_buffer: 1
    android_log_config { min_prio: PRIO_INFO log_ids: LID_DEFAULT log_ids: LID_SYSTEM log_ids: LID_CRASH }
  }
}
